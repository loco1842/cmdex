name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', '.planning/**']
  pull_request:
    branches: [main]
    # No paths-ignore here: GitHub does not synthesize a status for a
    # workflow that never triggers, so a doc-only PR would report no checks
    # at all and could stall forever under required-check branch protection.
  workflow_dispatch:
    # Manual trigger only — the `test` and `build-check` jobs are gated to
    # this event so they don't run on every push/PR; `typecheck` still runs
    # on push/PR as well as manual runs.

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  WAILS_VERSION: v3.0.0-beta.8
  NODE_VERSION: '24'
  PNPM_VERSION: '11'

jobs:
  typecheck:
    name: Type check
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ env.PNPM_VERSION }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-${{ env.PNPM_VERSION }}-
            ${{ runner.os }}-pnpm-

      - name: Install frontend deps
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Lint frontend
        working-directory: frontend
        run: pnpm lint

      - name: Cache Linux apt deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/apt-cache-type
          key: apt-type-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/apt-packages.txt') }}
          restore-keys: |
            apt-type-${{ runner.os }}-${{ runner.arch }}-

      - name: Install Linux build deps
        shell: bash
        run: |
          mkdir -p /tmp/apt-cache-type
          sudo cp -r /tmp/apt-cache-type/*.deb /var/cache/apt/archives/ 2>/dev/null || true
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $(cat .github/apt-packages.txt)
          sudo cp /var/cache/apt/archives/*.deb /tmp/apt-cache-type/ 2>/dev/null || true
          sudo chmod -R a+r /tmp/apt-cache-type

      - name: Create frontend/dist placeholder for go build
        shell: bash
        run: mkdir -p frontend/dist && touch frontend/dist/.gitkeep

      - name: Go build check
        run: go build ./...

      - name: Go lint (golangci-lint)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2

      - name: Cache Go bin
        id: cache-gobin
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/bin
          key: gobin-typecheck-${{ runner.os }}-${{ runner.arch }}-${{ env.WAILS_VERSION }}

      - name: Add Go bin to PATH
        shell: bash
        run: echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Install Wails CLI
        if: steps.cache-gobin.outputs.cache-hit != 'true'
        shell: bash
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${WAILS_VERSION}

      - name: Generate Wails bindings
        run: wails3 generate bindings -clean=true

      - name: TypeScript check
        working-directory: frontend
        run: pnpm tsc --noEmit

  test:
    name: Test
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ env.PNPM_VERSION }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-${{ env.PNPM_VERSION }}-
            ${{ runner.os }}-pnpm-

      - name: Install frontend deps
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Cache Linux apt deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/apt-cache-test
          key: apt-test-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/apt-packages.txt') }}
          restore-keys: |
            apt-test-${{ runner.os }}-${{ runner.arch }}-

      - name: Install Linux build deps
        shell: bash
        run: |
          mkdir -p /tmp/apt-cache-test
          sudo cp -r /tmp/apt-cache-test/*.deb /var/cache/apt/archives/ 2>/dev/null || true
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $(cat .github/apt-packages.txt)
          sudo cp /var/cache/apt/archives/*.deb /tmp/apt-cache-test/ 2>/dev/null || true
          sudo chmod -R a+r /tmp/apt-cache-test

      - name: Create frontend/dist placeholder for go build
        shell: bash
        run: mkdir -p frontend/dist && touch frontend/dist/.gitkeep

      - name: Go test
        run: go test -race ./...

      - name: Cache Go bin
        id: cache-gobin
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/bin
          key: gobin-test-${{ runner.os }}-${{ runner.arch }}-${{ env.WAILS_VERSION }}

      - name: Add Go bin to PATH
        shell: bash
        run: echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Install Wails CLI
        if: steps.cache-gobin.outputs.cache-hit != 'true'
        shell: bash
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${WAILS_VERSION}

      - name: Generate Wails bindings
        run: wails3 generate bindings -clean=true

      - name: Install Playwright browsers
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Run e2e tests
        working-directory: frontend
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            frontend/e2e/playwright-report/
            frontend/test-results/
          retention-days: 7

  test-windows:
    name: Test (Windows)
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Create frontend/dist placeholder for go build
        shell: bash
        run: mkdir -p frontend/dist && touch frontend/dist/.gitkeep

      - name: Add MinGW gcc to PATH (cgo, required by -race)
        shell: pwsh
        run: echo "C:\ProgramData\chocolatey\lib\mingw\tools\install\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Go test
        env:
          CGO_ENABLED: "1"
        run: go test -race ./...

  build-check:
    name: Build check (${{ matrix.os }})
    if: github.event_name == 'workflow_dispatch'
    needs: typecheck
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ env.PNPM_VERSION }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-${{ env.PNPM_VERSION }}-
            ${{ runner.os }}-pnpm-

      - name: Install Task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Linux apt deps
        if: runner.os == 'Linux'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/apt-cache
          key: apt-build-${{ matrix.os }}-${{ runner.arch }}-${{ hashFiles('.github/apt-packages.txt') }}
          restore-keys: |
            apt-build-${{ matrix.os }}-${{ runner.arch }}-

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p /tmp/apt-cache
          sudo cp -r /tmp/apt-cache/*.deb /var/cache/apt/archives/ 2>/dev/null || true
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $(cat .github/apt-packages.txt)
          sudo cp /var/cache/apt/archives/*.deb /tmp/apt-cache/ 2>/dev/null || true
          sudo chmod -R a+r /tmp/apt-cache

      - name: Cache Windows NSIS
        if: runner.os == 'Windows'
        id: cache-nsis
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: C:\Program Files (x86)\NSIS
          key: nsis-${{ runner.os }}

      - name: Install Windows NSIS
        if: runner.os == 'Windows' && steps.cache-nsis.outputs.cache-hit != 'true'
        shell: pwsh
        run: choco install nsis --no-progress -y

      - name: Add NSIS to PATH
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $nsisPath = Get-ChildItem "C:\Program Files*\NSIS" -Directory -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($nsisPath) {
            $nsisPath.FullName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          } else {
            "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

      - name: Cache Go bin
        id: cache-gobin
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/bin
          key: gobin-build-${{ runner.os }}-${{ runner.arch }}-${{ env.WAILS_VERSION }}

      - name: Add Go bin to PATH
        shell: bash
        run: echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Install Wails CLI
        if: steps.cache-gobin.outputs.cache-hit != 'true'
        shell: bash
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${WAILS_VERSION}

      - name: Install frontend deps
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Ensure frontend/dist exists
        shell: bash
        run: mkdir -p frontend/dist

      - name: Build
        run: task build