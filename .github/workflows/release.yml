name: Build & Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag (e.g. v1.0.0) — used only for naming artifacts'
        required: false
        default: 'dev'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  WAILS_VERSION: v3.0.0-beta.8
  NODE_VERSION: '24'
  PNPM_VERSION: '11'

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact: cmdex-linux-amd64
            task: package
          - os: macos-latest
            artifact: cmdex-darwin-universal
            task: package:dmg:universal
          - os: windows-latest
            artifact: cmdex-windows-amd64
            task: package

    env:
      RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.tag || 'dev' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Cache pnpm store
        uses: actions/cache@v6
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ env.PNPM_VERSION }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-${{ env.PNPM_VERSION }}-
            ${{ runner.os }}-pnpm-

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Install Task
        uses: arduino/setup-task@v3
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Linux apt deps
        if: runner.os == 'Linux'
        uses: actions/cache@v6
        with:
          path: /tmp/apt-cache
          key: apt-release-${{ matrix.os }}-${{ hashFiles('.github/apt-packages.txt') }}
          restore-keys: |
            apt-release-${{ matrix.os }}-

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p /tmp/apt-cache
          sudo cp -r /tmp/apt-cache/*.deb /var/cache/apt/archives/ 2>/dev/null || true
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $(cat .github/apt-packages.txt)
          sudo cp /var/cache/apt/archives/*.deb /tmp/apt-cache/ 2>/dev/null || true
          sudo chmod -R a+r /tmp/apt-cache

      - name: Cache Windows NSIS
        if: runner.os == 'Windows'
        id: cache-nsis
        uses: actions/cache@v6
        with:
          path: C:\Program Files (x86)\NSIS
          key: nsis-${{ runner.os }}

      - name: Install Windows NSIS
        if: runner.os == 'Windows' && steps.cache-nsis.outputs.cache-hit != 'true'
        shell: pwsh
        run: choco install nsis --no-progress -y

      - name: Add NSIS to PATH
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $nsisPath = Get-ChildItem "C:\Program Files*\NSIS" -Directory -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($nsisPath) {
            $nsisPath.FullName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          } else {
            "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

      - name: Cache Go bin
        id: cache-gobin
        uses: actions/cache@v6
        with:
          path: ~/go/bin
          key: gobin-${{ runner.os }}-${{ env.WAILS_VERSION }}

      - name: Add Go bin to PATH
        shell: bash
        run: echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Install Wails CLI
        if: steps.cache-gobin.outputs.cache-hit != 'true'
        shell: bash
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${WAILS_VERSION}

      - name: Package release build
        if: startsWith(github.ref, 'refs/tags/')
        run: task ${{ matrix.task }}

      - name: Build only for manual dispatch
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: task build

      - name: Collect release assets
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          mkdir -p release-assets
          shopt -s nullglob
          for f in bin/*.AppImage bin/*.deb bin/*.rpm bin/*.dmg bin/*-installer.exe; do
            cp "$f" release-assets/
          done

      - name: Upload workflow artifacts
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}-${{ env.RELEASE_TAG }}
          path: release-assets/*
          if-no-files-found: warn
          retention-days: 14

  release:
    name: Create Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Flatten artifact directories
        shell: bash
        run: |
          mkdir -p release-assets
          find artifacts -type f -exec cp {} release-assets/ \;

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}